<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五十音打字消除游戏</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container" id="gameContainer">
        <!-- 开始画面 -->
        <div class="start-screen" id="startScreen">
            <h1>五十音打字消除</h1>
            <p style="font-size: 20px; margin-bottom: 30px;">快速输入罗马音消除假名！</p>
            <button class="start-btn" onclick="showLevelSelect()">开始游戏</button>
            <div style="margin-top: 20px; font-size: 14px; text-align: center;">
                <p>操作说明：看到假名掉落时，快速输入对应的罗马音</p>
                <p>从あ行开始学习，逐步挑战更难的关卡！</p>
            </div>
        </div>

        <!-- 关卡选择画面 -->
        <div class="level-select-screen" id="levelSelectScreen" style="display: none;">
            <h2 style="font-size: 36px; margin-bottom: 30px;">选择关卡</h2>
            <div class="level-grid" id="levelGrid"></div>
            <button class="back-btn" onclick="backToStart()">返回主菜单</button>
        </div>

        <!-- 游戏结束画面 -->
        <div class="game-over-screen" id="gameOverScreen" style="display: none;">
            <h1>关卡完成</h1>
            <p id="finalScore" style="font-size: 24px; margin: 20px 0;"></p>
            <p id="finalCombo" style="font-size: 18px; margin-bottom: 20px;"></p>
            <p id="newRecord" style="font-size: 16px; color: #00ff00; margin-bottom: 30px;"></p>
            <button class="restart-btn" onclick="restartLevel()">重新挑战</button>
            <button class="back-btn" onclick="backToLevelSelect()">选择关卡</button>
        </div>

        <!-- 关卡完成弹窗 -->
        <div class="level-complete" id="levelComplete" style="display: none;">
            <h2>关卡完成！</h2>
            <p id="completeScore" style="font-size: 20px; margin: 15px 0;"></p>
            <p id="completeCombo" style="font-size: 16px; margin-bottom: 25px;"></p>
            <button class="start-btn" onclick="nextLevel()">下一关</button>
            <button class="back-btn" onclick="backToLevelSelect()">选择关卡</button>
        </div>

        <!-- 暂停画面 -->
        <div class="pause-screen" id="pauseScreen" style="display: none;">
            <h1>已暂停</h1>
            <p style="margin: 15px 0 25px;">按 Esc 或点击按钮继续</p>
            <button class="start-btn" id="resumeBtn">继续游戏</button>
            <button class="back-btn" id="quitBtn">退出关卡</button>
        </div>

        <!-- 游戏界面 -->
        <div class="game-header">
            <div class="level-info">关卡: <span id="currentLevel">1</span></div>
            <div class="score">分数: <span id="score">0</span></div>
            <div class="combo" id="comboDisplay">连击: <span id="combo">0</span></div>
            <div class="lives">生命: <span id="lives">❤️❤️❤️</span></div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="game-area" id="gameArea"></div>

        <div class="input-area">
            <input type="text" class="input-box" id="inputBox" placeholder="输入罗马音..." autocomplete="off">
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/matcher.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
